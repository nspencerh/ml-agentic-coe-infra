name: Deploy Infrastructure

# Granular permissions are required for OIDC authentication to AWS
permissions:
  id-token: write  # This allows the GitHub Actions to request an OIDC JWT token
  contents: read   # Allows actions/checkout to read the repository contents

on:
  push:
    branches:
      - main
      - 'feature/BRAIN-3580-update-repo'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AWS_REGION: ap-southeast-2
  AWS_ACCOUNT_ID: "595107320542"

