name: Terraform Plan

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      environment:
        required: true
        type: string
      location:
        required: false
        type: string
        default: "us"
        description: "Location used for terraform plan (used to infer global tfenv file, e.g. for components requiring data sovereignty)"
      extra_args:
        required: false
        type: string
        default: ""
        description: "Additional terraform plan arguments (e.g. -var flags for feature branches)"
      service_account:
        required: true
        type: string
        default: ""
        description: "Service account to use for Terraform operations"
    outputs:
      plan_gcs_path:
        description: "GCS path where the plan binary was uploaded"
        value: ${{ jobs.plan.outputs.plan_gcs_path }}

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.9.8"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan_gcs_path: ${{ steps.upload.outputs.gcs_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.8
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ inputs.service_account }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Plan
        id: plan
        working-directory: component/${{ inputs.component }}
        run: |
          make plan \
            ENV=${{ inputs.environment }} \
            LOCATION=${{ inputs.location }} \
            GHA_SERVICE_ACCOUNT=${{ inputs.service_account }} \
            EXTRA_ARGS="${{ inputs.extra_args }}"

      # NOTE: removing temporarily as the action marocchino/sticky-pull-request-comment@v2.9.0 is not allowed in transurban/ml-agentic-coe-infra because all actions must be from a repository owned by TU enterprise
      # - name: Post Plan to PR
      #   if: github.event_name == 'pull_request'
      #   uses: marocchino/sticky-pull-request-comment@v2.9.0
      #   with:
      #     header: plan-${{ inputs.component }}-${{ inputs.environment }}
      #     path: component/${{ inputs.component }}/tfplan.txt

      - name: Upload plan to GCS
        id: upload
        working-directory: component/${{ inputs.component }}
        run: |
          PLAN_PATH="plans/${{ inputs.component }}/${{ inputs.environment }}/${{ github.run_id }}-${{ github.run_attempt }}.tfplan"
          gsutil cp tfplan "gs://${{ vars.TF_STATE_BUCKET }}/${PLAN_PATH}"
          echo "gcs_path=${PLAN_PATH}" >> "$GITHUB_OUTPUT"
