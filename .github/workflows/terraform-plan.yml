name: Terraform Plan

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      environment:
        required: true
        type: string
      tfvars_file:
        required: true
        type: string
        description: "Path to the environment tfvars file relative to component dir"
      extra_args:
        required: false
        type: string
        default: ""
        description: "Additional terraform plan arguments (e.g. -var flags for feature branches)"
    outputs:
      plan_gcs_path:
        description: "GCS path where the plan binary was uploaded"
        value: ${{ jobs.plan.outputs.plan_gcs_path }}

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan_gcs_path: ${{ steps.upload.outputs.gcs_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.8
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: component/${{ inputs.component }}/src
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ inputs.component }}/${{ inputs.environment }}"

      - name: Terraform Plan
        working-directory: component/${{ inputs.component }}/src
        run: |
          terraform plan -no-color \
            -var-file="../../../variables/default.tfvars" \
            -var-file="../${{ inputs.tfvars_file }}" \
            ${{ inputs.extra_args }} \
            -out=tfplan

      - name: Upload plan to GCS
        id: upload
        working-directory: component/${{ inputs.component }}/src
        run: |
          PLAN_PATH="plans/${{ inputs.component }}/${{ inputs.environment }}/${{ github.run_id }}-${{ github.run_attempt }}.tfplan"
          gsutil cp tfplan "gs://${{ vars.TF_STATE_BUCKET }}/${PLAN_PATH}"
          echo "gcs_path=${PLAN_PATH}" >> "$GITHUB_OUTPUT"