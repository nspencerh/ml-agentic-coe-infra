name: Trigger Issue Comment → Jira Card Comment

permissions:
  contents: read
  issues: read

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to mirror comment from
        required: true
      comment:
        description: Comment text to send to Jira
        required: true
      comment_user:
        description: GitHub username of the comment reader
        required: true

jobs:
  call-issue-comment:
    uses: transurban/github-action-templates/.github/workflows/update-jira-card-on-issue-comment.yml@21a603695cf17a1867d846a361a81631373f6c56
    with:
      issue_number: ${{ github.event.issue.number || inputs.issue_number }}
      comment_user: ${{ github.event.comment.user.login || inputs.comment_user }}
      comment: ${{ github.event.comment.body || inputs.comment }}
    secrets:
      JIRA_USER: ${{ secrets.ATLASSIAN_JIRA_GITHUB_ACTION_USER_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.ATLASSIAN_JIRA_GITHUB_ACTION_API_TOKEN }}
      JIRA_BASE_URL: ${{ secrets.ATLASSIAN_JIRA_BASE_URL }}
      passed_github_token: ${{ secrets.PAT_GITHUB_TOKEN }}
