name: Deploy

on:
  push:
    branches: [main-cicd-develop]
    paths:
      - 'component/**'
      - 'variables/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      component:
        description: "Component to deploy (leave empty for auto-detect)"
        required: true 
        type: choice
        options:
          - gemini-enterprise-core
          - monitoring
      location:
        required: false
        type: choice
        options:
          - us
          - au
        default: "us"
        description: "Location used for terraform plan (used to infer global tfenv file, e.g. 'au' for components requiring data sovereignty)"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.resolve.outputs.components }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: resolve
        run: |
          if [[ -n "${{ inputs.component }}" ]]; then
            echo "components=[\"${{ inputs.component }}\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }})
          else
            # For workflow_dispatch, compare with the main branch
            CHANGED_FILES=$(git diff --name-only origin/main-cicd-develop...HEAD)
          fi

          # Extract component names from component/{name}/ paths
          COMPONENT_NAMES=$(echo "${CHANGED_FILES}" | grep -oP '^component/\K[^/]+' | sort -u)

          # variables/ changes affect all components
          if echo "${CHANGED_FILES}" | grep -qE '^variables/'; then
            COMPONENT_NAMES=$(find component -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
          fi

          # Module changes are versioned via git tags - they don't trigger component deploys.
          # Bump the module source ref in the component to pick up module changes.

          if [[ -z "${COMPONENT_NAMES}" ]]; then
            echo "components=[]" >> "$GITHUB_OUTPUT"
          else
            JSON=$(echo "${COMPONENT_NAMES}" | jq -R . | jq -s -c .)
            echo "components=${JSON}" >> "$GITHUB_OUTPUT"
          fi

  # --- Discovery ---
  discovery-plan:
    needs: [detect]
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect.outputs.components || '[]') }}
    uses: ./.github/workflows/terraform-plan.yml
    with:
      component: ${{ matrix.component }}
      environment: discovery
      qualifier: ${{ vars.DS_PP_QUALIFIER }}
      project_id: ${{ vars.DS_PP_PROJECT_ID }}
      tf_state_bucket: cicd-tfstate-${{ vars.DS_PP_PROJECT_ID }}-ause1-${{ vars.DS_PP_QUALIFIER }}
      service_account: cicd-gha-${{ vars.DS_PP_QUALIFIER }}@${{ vars.DS_PP_PROJECT_ID }}.iam.gserviceaccount.com
      backend_service_account: cicd-backend-${{ vars.DS_PP_QUALIFIER }}@${{ vars.DS_PP_PROJECT_ID }}.iam.gserviceaccount.com
    secrets: inherit

  discovery-apply:
    needs: [discovery-plan]
    uses: ./.github/workflows/terraform-apply.yml
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect.outputs.components || '[]') }}
    with:
      component: ${{ matrix.component }}
      environment: discovery
      tf_state_bucket: cicd-tfstate-${{ vars.DS_PP_PROJECT_ID }}-ause1-${{ vars.DS_PP_QUALIFIER }}
      service_account: cicd-gha-${{ vars.DS_PP_QUALIFIER }}@${{ vars.DS_PP_PROJECT_ID }}.iam.gserviceaccount.com
      backend_service_account: cicd-backend-${{ vars.DS_PP_QUALIFIER }}@${{ vars.DS_PP_PROJECT_ID }}.iam.gserviceaccount.com
      plan_gcs_path: ${{ needs.discovery-plan.outputs.plan_gcs_path }}
    secrets: inherit

  # --- Preprod ---
  preprod-plan:
    needs: [detect]
    # TODO - SemVer/CalVer?
    if: github.ref == 'refs/heads/main-cicd-develop' || github.ref_type == 'tag' && github.ref == 'refs/tags/v*' # Only run preprod for main branch or version tags
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect.outputs.components || '[]') }}
    uses: ./.github/workflows/terraform-plan.yml
    with:
      component: ${{ matrix.component }}
      environment: preprod
      qualifier: ${{ vars.US_PP_QUALIFIER }}
      project_id: ${{ vars.US_PP_PROJECT_ID }}
      tf_state_bucket: cicd-tfstate-${{ vars.US_PP_PROJECT_ID }}-ause1-${{ vars.US_PP_QUALIFIER }}
      service_account: cicd-gha-${{ vars.US_PP_QUALIFIER }}@${{ vars.US_PP_PROJECT_ID }}.iam.gserviceaccount.com
      backend_service_account: cicd-backend-${{ vars.US_PP_QUALIFIER }}@${{ vars.US_PP_PROJECT_ID }}.iam.gserviceaccount.com
    secrets: inherit

  preprod-apply:
    needs: [preprod-plan]
    uses: ./.github/workflows/terraform-apply.yml
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect.outputs.components || '[]') }}
    with:
      component: ${{ matrix.component }}
      environment: preprod
      tf_state_bucket: cicd-tfstate-${{ vars.US_PP_PROJECT_ID }}-ause1-${{ vars.US_PP_QUALIFIER }}
      service_account: cicd-gha-${{ vars.US_PP_QUALIFIER }}@${{ vars.US_PP_PROJECT_ID }}.iam.gserviceaccount.com
      backend_service_account: cicd-backend-${{ vars.US_PP_QUALIFIER }}@${{ vars.US_PP_PROJECT_ID }}.iam.gserviceaccount.com
      plan_gcs_path: ${{ needs.preprod-plan.outputs.plan_gcs_path }}
    secrets: inherit

  preprod-eval:
    needs: [preprod-apply]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.8
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_SERVICE_ACCOUNT }}

      - name: Run preprod evaluation
        run: |
          echo "Running preprod evaluation"
          # agents-cli eval --environment preprod

      - name: Log Deployment Succeeded
        run: |
          echo "Logging succeeded to BigQuery"
          # bq-log-deployment.py log-event --status succeeded --component gemini --environment preprod --commit_sha ${{ github.sha }}

      - name: Log Deployment Failed
        if: failure()
        run: |
          echo "Logging failed eval to BigQuery"
          # bq-log-deployment.py log-event --status failed --component gemini --environment preprod --commit_sha ${{ github.sha }} --failure_reason "Preprod eval failed"

  # --- Prod ---
  prod-plan:
    needs: [detect, preprod-eval]
    if: github.ref_type == 'tag' && github.ref == 'refs/tags/v*' # Only run production for version tags
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect.outputs.components || '[]') }}
    uses: ./.github/workflows/terraform-plan.yml
    with:
      component: ${{ matrix.component }}
      environment: prod
      qualifier: ${{ vars.US_PR_QUALIFIER }}
      project_id: ${{ vars.US_PR_PROJECT_ID }}
      tf_state_bucket: cicd-tfstate-${{ vars.US_PR_PROJECT_ID }}-ause1-${{ vars.US_PR_QUALIFIER }}
      service_account: cicd-gha-${{ vars.US_PR_QUALIFIER }}@${{ vars.US_PR_PROJECT_ID }}.iam.gserviceaccount.com
      backend_service_account: cicd-backend-${{ vars.US_PR_QUALIFIER }}@${{ vars.US_PR_PROJECT_ID }}.iam.gserviceaccount.com
    secrets: inherit

  prod-apply:
    needs: [prod-plan]
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect.outputs.components || '[]') }}
    uses: ./.github/workflows/terraform-apply.yml
    with:
      component: ${{ matrix.component }}
      environment: prod
      tf_state_bucket: cicd-tfstate-${{ vars.US_PR_PROJECT_ID }}-ause1-${{ vars.US_PR_QUALIFIER }}
      service_account: cicd-gha-${{ vars.US_PR_QUALIFIER }}@${{ vars.US_PR_PROJECT_ID }}.iam.gserviceaccount.com
      backend_service_account: cicd-backend-${{ vars.US_PR_QUALIFIER }}@${{ vars.US_PR_PROJECT_ID }}.iam.gserviceaccount.com
      plan_gcs_path: ${{ needs.prod-plan.outputs.plan_gcs_path }}
    secrets: inherit

  post-prod-eval:
    needs: [prod-apply]
    runs-on: ubuntu-latest
    outputs:
      eval_passed: ${{ steps.eval.outputs.passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.8
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_SERVICE_ACCOUNT }}

      - name: Run post-production eval
        id: eval
        run: |
          echo "Running post-production evaluation"
          # result=$(agents-cli eval --environment prod)
          # echo "passed=$result" >> "$GITHUB_OUTPUT"
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Log Deployment Succeeded
        if: steps.eval.outputs.passed == 'true'
        run: |
          echo "Logging succeeded to BigQuery"
          # bq-log-deployment.py log-event --status succeeded --component gemini --environment prod --commit_sha ${{ github.sha }}

      - name: Log Deployment Failed
        if: steps.eval.outputs.passed == 'false' || failure()
        run: |
          echo "Logging failed eval to BigQuery"
          # bq-log-deployment.py log-event --status failed --component gemini --environment prod --commit_sha ${{ github.sha }} --failure_reason "Prod eval failed"

  rollback:
    needs: post-prod-eval
    if: needs.post-prod-eval.outputs.eval_passed == 'false'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.8
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: cicd-gha-${{ vars.US_PR_QUALIFIER }}@${{ vars.US_PR_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Query last succeeded deployment
        run: |
          echo "Querying BigQuery for last succeeded deployment"
          # bq-log-deployment.py query-last-success --component gemini --environment prod

      - name: Rollback
        run: |
          echo "Rolling back to last successful deployment"
          # Redeploy using package_uri or container_image from query result
