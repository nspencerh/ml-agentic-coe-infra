name: Trigger Issue Closed → Jira Card Transition
#Author: Thomas Hyland

permissions:
  contents: read
  issues: read

on:
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_title:
        description: Title of the issue to mirror to Jira!
        required: true
      owner:
        description: GitHub owner/org
        required: true
      repo:
        description: Repository name
        required: true
      issue_number:
        description: Issue number
        required: true
      issue_url:
        description: URL of the GitHub issue
        required: false
      closer:
        description: GitHub username of the user who closed the issue
        required: false

jobs:
  call-issue-closed:
    uses: transurban/github-action-templates/.github/workflows/update-jira-card-on-issue-closed.yml@21a603695cf17a1867d846a361a81631373f6c56
    with:
      issue_title: ${{ github.event.issue.title || inputs.issue_title }}
      owner: ${{ github.event.repository.owner.login || inputs.owner }}
      repo: ${{ github.event.repository.name || inputs.repo }}
      issue_number: ${{ github.event.issue.number || inputs.issue_number }}
      issue_url: ${{ github.event.issue.html_url || inputs.issue_url }}
      closer: ${{ github.actor || inputs.closer }}
    secrets:
      JIRA_USER: ${{ secrets.ATLASSIAN_JIRA_GITHUB_ACTION_USER_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.ATLASSIAN_JIRA_GITHUB_ACTION_API_TOKEN }}
      JIRA_BASE_URL: ${{ secrets.ATLASSIAN_JIRA_BASE_URL }}
      passed_github_token: ${{ secrets.PAT_GITHUB_TOKEN }}
