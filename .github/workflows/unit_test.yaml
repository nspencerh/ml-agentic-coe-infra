name: Run Unit Tests

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_call: # Added so this can be used as a dependency in other workflows

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
      # commented out to avoid test failures due to no tests being present
      # - name: Run unit tests
        # run: uv run pytest tests/unit/ -v