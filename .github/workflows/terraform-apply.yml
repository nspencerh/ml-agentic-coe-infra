name: Terraform Apply

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      environment:
        required: true
        type: string
      plan_gcs_path:
        required: true
        type: string
        description: "GCS path to the plan binary to apply"

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2.1.8
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.TERRAFORM_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: component/${{ inputs.component }}
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=${{ inputs.component }}/${{ inputs.environment }}"

      - name: Download plan from GCS
        working-directory: component/${{ inputs.component }}
        run: |
          gsutil cp "gs://${{ vars.TF_STATE_BUCKET }}/${{ inputs.plan_gcs_path }}" tfplan

      - name: Terraform Apply
        working-directory: component/${{ inputs.component }}
        run: terraform apply tfplan
