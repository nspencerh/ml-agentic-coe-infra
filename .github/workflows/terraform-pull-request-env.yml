name: Ephemeral Environment

on:
  pull_request:
    branches: [main-cicd-develop]
    types: [opened, synchronize, closed]
    paths:
      - 'component/**'
      - 'variables/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: "1.9.8"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.resolve.outputs.components }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: resolve
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          echo "############################"
          echo "${{ github.event.before }}"
          echo "${{ github.sha }}"
          echo "${CHANGED_FILES}"
          echo "############################"

          # Extract component names from component/{name}/ paths
          COMPONENT_NAMES=$(echo "${CHANGED_FILES}" | grep -oP '^component/\K[^/]+' | sort -u)

          # variables/ changes affect all components
          if echo "${CHANGED_FILES}" | grep -qE '^variables/'; then
            COMPONENT_NAMES=$(find component -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
          fi

          if [[ -z "${COMPONENT_NAMES}" ]]; then
            echo "components=[]" >> "$GITHUB_OUTPUT"
          else
            JSON=$(echo "${COMPONENT_NAMES}" | jq -R . | jq -s -c .)
            echo "components=${JSON}" >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: detect
    if: github.event.action != 'closed' && needs.detect.outputs.components != '[]'
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect.outputs.components) }}
    uses: ./.github/workflows/terraform-plan.yml
    with:
      component: ${{ matrix.component }}
      environment: pr-${{ github.event.number }}
      qualifier: ${{ vars.DS_PP_QUALIFIER }}
      project_id: ${{ vars.DS_PP_PROJECT_ID }}
      extra_args: '-var="environment_suffix=pr-${{ github.event.number }}"'
      tf_state_bucket: cicd-tfstate-${{ vars.DS_PP_PROJECT_ID }}-ause1-${{ vars.DS_PP_QUALIFIER }}
      gha_service_account: cicd-gha-${{ vars.DS_PP_QUALIFIER }}@${{ vars.DS_PP_PROJECT_ID }}.iam.gserviceaccount.com
      backend_service_account: cicd-backend-${{ vars.DS_PP_QUALIFIER }}@${{ vars.DS_PP_PROJECT_ID }}.iam.gserviceaccount.com
    secrets: inherit

  apply:
    needs: [detect, plan]
    if: github.event.action != 'closed' && needs.detect.outputs.components != '[]'
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect.outputs.components) }}
    uses: ./.github/workflows/terraform-apply.yml
    with:
      component: ${{ matrix.component }}
      environment: pr-${{ github.event.number }}
      tf_state_bucket: cicd-tfstate-${{ vars.DS_PP_PROJECT_ID }}-ause1-${{ vars.DS_PP_QUALIFIER }}
      gha_service_account: cicd-gha-${{ vars.DS_PP_QUALIFIER }}@${{ vars.DS_PP_PROJECT_ID }}.iam.gserviceaccount.com
      backend_service_account: cicd-backend-${{ vars.DS_PP_QUALIFIER }}@${{ vars.DS_PP_PROJECT_ID }}.iam.gserviceaccount.com
      plan_gcs_path: ${{ needs.plan.outputs.plan_gcs_path }}
    secrets: inherit

  destroy:
    needs: detect
    if: github.event.action == 'closed' && needs.detect.outputs.components != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect.outputs.components) }}
    env:
      environment: pr-${{ github.event.number }}
      tf_state_bucket: cicd-tfstate-${{ vars.DS_PP_PROJECT_ID }}-ause1-${{ vars.DS_PP_QUALIFIER }}
      backend_service_account: cicd-backend-${{ vars.DS_PP_QUALIFIER }}@${{ vars.DS_PP_PROJECT_ID }}.iam.gserviceaccount.com
      deploy_service_account: cicd-deploy-${{ vars.DS_PP_QUALIFIER }}@${{ vars.DS_PP_PROJECT_ID }}.iam.gserviceaccount.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: cicd-gha-${{ vars.DS_PP_QUALIFIER }}@${{ vars.DS_PP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: component/${{ matrix.component }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.tf_state_bucket }}" \
            -backend-config="prefix=tfstate/${{ matrix.component }}" \
            -backend-config=impersonate_service_account=${{ env.backend_service_account }}
          terraform workspace select ${{ env.environment }}

      - name: Terraform Destroy
        working-directory: component/${{ matrix.component }}
        run: |
          terraform destroy -auto-approve \
            -var="deploy_service_account=${{ env.deploy_service_account }}" \
            -var-file="../../variables/env/us/default.tfvars" \
            -var-file="../../variables/env/us/discovery.tfvars" \
            -var-file="env/us/discovery.tfvars" 
        # -var="environment=pr-${{ github.event.number }}" \
        # -var="environment_suffix=pr-${{ github.event.number }}"