[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-template"
version = "0.1.0"
description = "AI & Engineering Template Repository"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Uncomment and pick dependencies based on your project needs:
    # "omegaconf>=2.3.0",
    # "pydantic>=2.0.0",
    # "mlflow>=2.0.0",
    # "pandas>=2.0.0",
    # "scikit-learn>=1.0.0",
    # "fastapi>=0.100.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.1.0",
    "bandit>=1.7.5",
    "pip-audit>=2.7.0",
    "pre-commit>=3.0.0",
    "ty>=0.0.23",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "D",  # pydocstyle
]
ignore = []

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dataops", "src/mlops", "src/devops"]
