repos:
  # --- General Code Hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements

  # --- Local System & Python Hooks ---
  - repo: local
    hooks:
      # --- Python Code Quality and Type Checking ---
      - id: ruff-check
        name: ruff linter
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff formatter
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ty-check
        name: ty type checker
        entry: uv run ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      # --- Security & Secrets Management ---
      # Static Application Security Testing (SAST) for Python.
      - id: bandit
        name: bandit security scan
        entry: uv run bandit -c pyproject.toml -r src/
        language: system
        types: [python]
        pass_filenames: false

  # --- External Tool Dependencies ---
  # Scans for hardcoded secrets, API keys, and passwords.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

# =========================================================================
# OPTIONAL HOOKS FOR TEMPLATE USERS
# Uncomment the blocks below based on your project's specific requirements.
# =========================================================================

